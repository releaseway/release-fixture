name: release-fixture
desc: Deterministic release asset fixture for automation integration tests
homepage: https://github.com/releaseway/release-fixture
license: MIT
version_scheme: 1

distribution:
  type: github-release
  tag: "v{version}"
  assets:
    macos-arm64: release-fixture_macos_arm64.tar.gz
    macos-x86_64: release-fixture_macos_x86_64.tar.gz
    linux-arm64: release-fixture_linux_arm64.tar.gz
    linux-x86_64: release-fixture_linux_x86_64.tar.gz

install: |
  bin.install "release-fixture"

test: |
  assert_match "release-fixture #{version}", shell_output("#{bin}/release-fixture --version")
