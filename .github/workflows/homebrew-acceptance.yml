name: Homebrew public API acceptance

on:
  workflow_dispatch:
    inputs:
      automation-ref:
        description: Full Homebrew candidate SHA matching the four committed workflow pins
        required: true
        default: 061b8dc1e7096931a9ef0e73a064a4316fd1bf89
        type: string
      tag:
        description: Published release-fixture tag to validate and publish to the fixture tap.
        required: true
        type: string

      tap-repository:
        description: Test destination tap.
        type: choice
        default: releaseway/homebrew-tap-fixture
        options:
          - releaseway/homebrew-tap-fixture
          - releaseway/homebrew-starter-smoke
      tap-secret:
        description: Test destination deploy-key secret.
        type: choice
        default: HOMEBREW_TAP_DEPLOY_KEY
        options:
          - HOMEBREW_TAP_DEPLOY_KEY
          - STARTER_TAP_DEPLOY_KEY

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.source.outputs.commit }}
      version: ${{ steps.source.outputs.version }}
    steps:
      - name: Checkout fixture tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify candidate workflow pins
        env:
          AUTOMATION_REF: ${{ inputs.automation-ref }}
        run: python3 scripts/verify-homebrew-candidate.py

      - name: Resolve source identity
        id: source
        env:
          TAG: ${{ inputs.tag }}
          EVENT_SHA: ${{ github.sha }}
          TAP_REPOSITORY: ${{ inputs.tap-repository }}
          TAP_SECRET: ${{ inputs.tap-secret }}
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "fixture tag must be stable SemVer vX.Y.Z: $TAG" >&2
            exit 1
          fi
          case "$TAP_REPOSITORY:$TAP_SECRET" in
            releaseway/homebrew-tap-fixture:HOMEBREW_TAP_DEPLOY_KEY|releaseway/homebrew-starter-smoke:STARTER_TAP_DEPLOY_KEY) ;;
            *) echo "unsupported fixture tap or credential" >&2; exit 1 ;;
          esac
          COMMIT="$(git rev-parse HEAD)"
          if [ "$COMMIT" != "$EVENT_SHA" ]; then
            echo "run this acceptance workflow from the same fixture tag: tag=$COMMIT event=$EVENT_SHA" >&2
            exit 1
          fi
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

  check-source:
    needs: resolve
    uses: releaseway/homebrew-actions/.github/workflows/check.yml@061b8dc1e7096931a9ef0e73a064a4316fd1bf89
    with:
      tap-repository: ${{ inputs.tap-repository }}
      spec-path: .github/homebrew/source-formula.yml

  check-release:
    needs: resolve
    uses: releaseway/homebrew-actions/.github/workflows/check.yml@061b8dc1e7096931a9ef0e73a064a4316fd1bf89
    with:
      tap-repository: ${{ inputs.tap-repository }}
      spec-path: .github/homebrew/formula.yml

  publish-source:
    needs:
      - resolve
      - check-source
    uses: releaseway/homebrew-actions/.github/workflows/publish.yml@061b8dc1e7096931a9ef0e73a064a4316fd1bf89
    with:
      commit: ${{ needs.resolve.outputs.commit }}
      version: ${{ needs.resolve.outputs.version }}
      tap-repository: ${{ inputs.tap-repository }}
      spec-path: .github/homebrew/source-formula.yml
    secrets:
      tap_deploy_key: ${{ secrets[inputs.tap-secret] }}

  publish-release:
    needs:
      - resolve
      - check-release
    uses: releaseway/homebrew-actions/.github/workflows/publish.yml@061b8dc1e7096931a9ef0e73a064a4316fd1bf89
    with:
      commit: ${{ needs.resolve.outputs.commit }}
      version: ${{ needs.resolve.outputs.version }}
      tap-repository: ${{ inputs.tap-repository }}
      spec-path: .github/homebrew/formula.yml
    secrets:
      tap_deploy_key: ${{ secrets[inputs.tap-secret] }}

  verify:
    needs:
      - resolve
      - publish-source
      - publish-release
    runs-on: ubuntu-24.04
    steps:
      - name: Check reusable workflow outputs
        env:
          SOURCE_FORMULA: ${{ needs.publish-source.outputs.formula }}
          SOURCE_VERSION: ${{ needs.publish-source.outputs.version }}
          SOURCE_STATE: ${{ needs.publish-source.outputs.state }}
          RELEASE_FORMULA: ${{ needs.publish-release.outputs.formula }}
          RELEASE_VERSION: ${{ needs.publish-release.outputs.version }}
          RELEASE_STATE: ${{ needs.publish-release.outputs.state }}
          EXPECTED_VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          [ "$SOURCE_FORMULA" = "release-source-fixture" ]
          [ "$SOURCE_VERSION" = "$EXPECTED_VERSION" ]
          [ "$RELEASE_FORMULA" = "release-fixture" ]
          [ "$RELEASE_VERSION" = "$EXPECTED_VERSION" ]
          for state in "$SOURCE_STATE" "$RELEASE_STATE"; do
            case "$state" in
              published|unchanged) ;;
              *) echo "unexpected publish state: $state" >&2; exit 1 ;;
            esac
          done

      - name: Checkout destination tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.tap-repository }}
          path: tap
          persist-credentials: false

      - name: Verify published Formulae
        env:
          COMMIT: ${{ needs.resolve.outputs.commit }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail

          test -f tap/Formula/release-source-fixture.rb
          grep -Fxq '  version_scheme 1' tap/Formula/release-source-fixture.rb
          grep -Fq 'class ReleaseSourceFixture < Formula' tap/Formula/release-source-fixture.rb
          grep -Fq "/archive/$COMMIT.tar.gz" tap/Formula/release-source-fixture.rb

          test -f tap/Formula/release-fixture.rb
          grep -Fxq '  version_scheme 1' tap/Formula/release-fixture.rb
          grep -Fq 'class ReleaseFixture < Formula' tap/Formula/release-fixture.rb
          grep -Fq "/releases/download/v$VERSION/" tap/Formula/release-fixture.rb

      - name: Record candidate acceptance evidence
        env:
          AUTOMATION_REF: ${{ inputs.automation-ref }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          env = os.environ
          evidence = dict(schema=1, candidate_repository='releaseway/homebrew-actions', candidate_sha=env['AUTOMATION_REF'].lower(),
                          fixture_repository=env['GITHUB_REPOSITORY'], fixture_commit=env['GITHUB_SHA'],
                          run_id=int(env['GITHUB_RUN_ID']), run_attempt=int(env['GITHUB_RUN_ATTEMPT']),
                          workflow='homebrew-acceptance.yml', scenario='homebrew-public', state='verified', version=env['VERSION'])
          Path('acceptance.json').write_text(json.dumps(evidence, indent=2) + '\n')
          PY

      - name: Upload candidate acceptance evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: releaseway-acceptance-${{ github.run_attempt }}
          path: acceptance.json
          retention-days: 30
          if-no-files-found: error
