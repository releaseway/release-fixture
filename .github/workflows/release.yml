name: release fixture

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing fixture tag to publish.
        required: false
        type: string
      mode:
        description: Resolve an existing tag or prepare the next release atomically.
        required: true
        default: resolve
        type: choice
        options:
          - resolve
          - prepare

permissions:
  contents: write

concurrency:
  group: release-fixture-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve fixture tag
        id: release
        uses: releaseway/actions/prepare@9feef2fe68e2b5bc8739f3e23877499b0fa32a6c # v0.4.0
        with:
          mode: ${{ inputs.mode }}
          tag: ${{ inputs.tag }}

      - name: Build deterministic fixture assets
        run: python3 scripts/build-fixtures.py "${{ steps.release.outputs.version }}"

      - name: Publish fixture release
        id: publish
        uses: releaseway/actions@9feef2fe68e2b5bc8739f3e23877499b0fa32a6c # v0.4.0
        with:
          tag: ${{ steps.release.outputs.tag }}
          commit: ${{ steps.release.outputs.commit }}
          assets: dist/release-fixture_*.tar.gz
          title: ${{ steps.release.outputs.tag }}
          latest: current-series

      - name: Summary
        run: |
          {
            echo "### Release fixture"
            echo ""
            echo "- state: ${{ steps.publish.outputs.state }}"
            echo "- release: ${{ steps.publish.outputs.release-url }}"
          } >> "$GITHUB_STEP_SUMMARY"
