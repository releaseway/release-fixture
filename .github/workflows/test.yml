name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check-source:
    uses: releaseway/homebrew-actions/.github/workflows/check.yml@4bbfa6aafc92a6cb8e823a51d54a6573237e0a76 # v0.2.0
    with:
      tap-repository: releaseway/homebrew-tap-fixture
      spec-path: .github/homebrew/source-formula.yml

  check-release:
    uses: releaseway/homebrew-actions/.github/workflows/check.yml@4bbfa6aafc92a6cb8e823a51d54a6573237e0a76 # v0.2.0
    with:
      tap-repository: releaseway/homebrew-tap-fixture
      spec-path: .github/homebrew/formula.yml

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify deterministic fixture assets
        run: python3 test/fixtures.py
      - name: Candidate contracts
        run: python3 test/candidates.py
      - name: Expected action failure assertions
        run: python3 test/expected-failure.py
      - name: Whitespace
        run: git diff --check

  actionlint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26.x"
          check-latest: true
      - name: Lint workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
