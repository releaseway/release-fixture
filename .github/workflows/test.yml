name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check-source:
    uses: releaseway/homebrew-actions/.github/workflows/check.yml@d54a5e5dd6734c8eb053fb923c5e82b1438b5055
    with:
      tap-repository: releaseway/homebrew-tap-fixture
      spec-path: .github/homebrew/source-formula.yml

  check-release:
    uses: releaseway/homebrew-actions/.github/workflows/check.yml@d54a5e5dd6734c8eb053fb923c5e82b1438b5055
    with:
      tap-repository: releaseway/homebrew-tap-fixture
      spec-path: .github/homebrew/formula.yml

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
          check-latest: true
          cache: false
      - name: Native Homebrew feature fixtures
        run: python3 test/homebrew-features.py
      - name: Verify deterministic fixture assets
        run: python3 test/fixtures.py
      - name: Candidate contracts
        run: python3 test/candidates.py
      - name: Expected action failure assertions
        run: python3 test/expected-failure.py
      - name: App-free fixture contracts
        run: python3 test/app-free.py
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Distribution fixture contracts
        run: |
          python3 test/distribution.py
          python3 test/distribution-release-set.py
      - name: Whitespace
        run: git diff --check

  actionlint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
          check-latest: true
          cache: false
      - name: Lint workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
